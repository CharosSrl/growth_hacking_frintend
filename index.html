<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowthOS — Growth Strategy Canvas</title>
  <meta name="description" content="B2B Growth Strategy Canvas — map your growth model in one place">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase compat SDK (auth only) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <!-- ── Firebase config + setup detection ──────────────────────────── -->
  <!-- build.js replaces window.FIREBASE_CONFIG at build time (Netlify). -->
  <!-- If apiKey starts with "YOUR_", the in-app setup screen is shown.  -->
  <script>
    (function () {
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem('growthos_config') || 'null'); } catch (e) {}
      window.FIREBASE_CONFIG = saved || {"apiKey":"YOUR_API_KEY","authDomain":"YOUR_PROJECT.firebaseapp.com","projectId":"YOUR_PROJECT_ID","storageBucket":"YOUR_PROJECT.appspot.com","messagingSenderId":"YOUR_SENDER_ID","appId":"YOUR_APP_ID","measurementId":""};
      window.API_BASE = '/api';
      window._needsSetup = window.FIREBASE_CONFIG.apiKey.startsWith('YOUR_');
      if (!window._needsSetup) { firebase.initializeApp(window.FIREBASE_CONFIG); }
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- Initial loading state before JS boots -->
    <div style="display:flex;align-items:center;justify-content:center;height:100dvh">
      <div style="width:24px;height:24px;border:2px solid rgba(255,255,255,.1);border-top-color:#6366f1;border-radius:50%;animation:spin .65s linear infinite"></div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>

  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-container"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
