[build]
  command = "npm ci && npm run build"
  publish = "dist/growth-os/browser"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api/* → Railway backend (keeps the origin hidden, avoids CORS)
[[redirects]]
  from    = "/api/*"
  to      = "https://appealing-creativity-production.up.railway.app/:splat"
  status  = 200
  force   = true

# SPA fallback — serve index.html for every unmatched path
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Never cache the HTML shell — it references hashed bundles, so a stale shell
# points at bundle hashes that no longer exist (→ blank page / MIME errors).
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are immutable — cache them hard.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
